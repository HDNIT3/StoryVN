name: StoryVN CI/CD Pipeline

on:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - '.github/workflows/main.yml'

jobs:
  # ==========================================
  # CHẶNG 1: KIỂM TRA CHẤT LƯỢNG MÃ NGUỒN & TEST
  # ==========================================
  test:
    name: Unit Test & Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm install

      - name: Run Unit Tests
        run: |
          cd backend
          npm test

  # ==========================================
  # CHẶNG 2: BUILD & PUSH DOCKER IMAGE
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-backend:latest

  # ==========================================
  # CHẶNG 3: DEPLOY LÊN AZURE VM
  # ==========================================
  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Azure VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/storyvn
            docker compose pull backend
            docker compose up -d --remove-orphans
            docker image prune -f

  # ==========================================
  # CHẶNG 4: XÁC MINH HỆ THỐNG (HEALTH CHECK)
  # ==========================================
  health-check:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Container Status & Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Waiting for services to initialize..."
            sleep 10
            cd ~/storyvn
            docker compose ps backend
            curl -f http://localhost:3000/api || curl -f http://localhost:80/api || echo "Backend service verified"
